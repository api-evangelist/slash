aid: slash
name: Slash
description: >-
  Slash is a business banking and finance platform for modern companies —
  startups, agencies, e-commerce sellers, and enterprises — combining business
  checking, unlimited virtual and physical corporate cards, ACH/wire and
  real-time payments, global USD accounts, stablecoin on/off ramps, treasury,
  invoicing, expense management, and reporting on one platform. Founded in 2021
  and valued at $1.4B after a 2026 Series C led by Ribbit Capital, Slash exposes
  a REST API (currently in Beta) covering accounts, virtual accounts, cards and
  card groups, transactions, transfers, invoices, contacts and customers,
  expense reports, webhooks, and FDX-compliant financial data access — plus an
  official hosted MCP server, Agent Requests with human-in-the-loop approval,
  and Python and Node.js SDKs for AI-agent and programmatic integration.
